services:
  edge:
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -c "corepack enable && pnpm --filter @hpos/edge start"
    ports:
      - "4000:4000"
    volumes:
      - ../..:/app
      - edge-data:/app/apps/edge/data
    environment:
      CI: "true"
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: file:./data/pos.db
      POS_VERSION: dev
    restart: "no"

volumes:
  edge-data:
