services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hpos
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hpos"]
      interval: 5s
      timeout: 5s
      retries: 10

  cloud:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @hpos/cloud start"
    ports:
      - "4001:4001"
    volumes:
      - ../..:/app
    environment:
      NODE_ENV: production
      PORT: "4001"
      DB_DIALECT: postgres
      DATABASE_URL: postgres://postgres:postgres@db:5432/hpos
      CRON_SECRET: dev-cron-secret
      POS_VERSION: dev
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg-data:
